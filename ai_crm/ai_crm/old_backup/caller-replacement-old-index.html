<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caller Replacement – Saarva Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="caller-replacement.css">
</head>
<body>

<!-- ── Sidebar ── -->
<div class="sidebar" id="sidebar">
    <div class="logo">
        <i class="fa-solid fa-chart-line"></i>
        <span>Saarva Admin</span>
    </div>
    <div class="profile">
        <div class="profile-icon">S</div>
        <div class="profile-info">
            <h3>Saarva Admin</h3>
            <p>Control Panel</p>
        </div>
    </div>
    <ul class="menu">
        <li><a href="/crm-dashboard"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>
        <li><a href="/user-management"><i class="fa-solid fa-users"></i><span>User Management</span></a></li>
        <li><a href="/price-config"><i class="fa-solid fa-tags"></i><span>Pricing Config</span></a></li>
        <li class="active"><a href="/caller-replacement"><i class="fa-solid fa-headset"></i><span>Caller Replacement</span></a></li>
        <li><a href="/area-management"><i class="fa-solid fa-location-dot"></i><span>Area Management</span></a></li>
        <li><a href="/lead-management"><i class="fa-solid fa-chart-column"></i><span>Lead Management</span></a></li>
    </ul>
</div>

<!-- ── Main Content ── -->
<div class="main-content" id="mainContent">
    <div class="topbar"></div>
    <div class="page-body">
        <div class="card">
            <div class="title">Caller Replacement</div>
            <div class="subtitle">Bulk reassign leads between callers</div>

            <div class="row">
                <div class="field">
                    <label>From Caller</label>
                    <select id="fromCaller">
                        <option>Select caller</option>
                        <option>Sujata</option>
                        <option>Surekha</option>
                        <option>Amit</option>
                    </select>
                </div>
                <div class="arrow">➜</div>
                <div class="field">
                    <label>To Caller</label>
                    <select id="toCaller">
                        <option>Select caller</option>
                        <option>Ramesh</option>
                        <option>Shivam</option>
                        <option>Khushi</option>
                    </select>
                </div>
            </div>

            <div class="full field">
                <label>Lead Type</label>
                <select id="leadType">
                    <option>All Leads</option>
                    <option>Hot Leads</option>
                    <option>Cold Leads</option>
                </select>
            </div>

            <button class="btn" onclick="handleReassign()">👤 Reassign Leads</button>
        </div>
    </div>
</div>

<script src="caller-replacement.js"></script>
</body>
</html>
