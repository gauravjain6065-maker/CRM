<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Saarva Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-wrapper">

    <!-- Left Panel - Image -->
    <div class="login-left">
        <img src="/assets/ai_crm/images/login_avatar.png" alt="Login Avatar" class="avatar-img">
        <div class="brand-text">
            <h1>Saarva CRM</h1>
            <p>Manage your business smarter, faster.</p>
        </div>
    </div>

    <!-- Right Panel - Form -->
    <div class="login-right">

        <div class="login-box">

            <div class="login-logo">
                <i class="fa-solid fa-chart-line"></i>
                <span>Saarva Admin</span>
            </div>

            <h2 class="login-title">Welcome Back 👋</h2>
            <p class="login-sub">Sign in to your admin account</p>

            <form id="loginForm" onsubmit="handleLogin(event)">

                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
                    <input type="email" id="email" placeholder="admin@saarva.com" required>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-pass" onclick="togglePassword()">
                            <i class="fa-solid fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-row">
                    <label class="remember">
                        <input type="checkbox" id="remember"> Remember me
                    </label>
                    <a href="#" class="forgot">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="btnText">Sign In</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>

                <div class="error-msg" id="errorMsg"></div>

            </form>

        </div>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
